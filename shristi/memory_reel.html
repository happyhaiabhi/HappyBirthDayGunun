<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Reel — Happy Birthday Shristi!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(160deg, #2a1b3d 0%, #44318d 55%, #2a1b3d 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #fff;
    padding: 14px;
  }

  .reel-title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(1.5rem, 5vw, 2.3rem);
    font-weight: 700;
    text-align: center;
    background: linear-gradient(90deg, #FFB6C1, #FFD700, #DDA0DD);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }

  .stage {
    position: relative;
    width: min(92vw, 420px);
    aspect-ratio: 3 / 4;
    max-height: 62vh;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45), 0 0 0 3px rgba(255,215,0,0.35);
    background: rgba(255,255,255,0.06);
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: scale(1.05);
    transition: opacity 0.9s ease, transform 1.6s ease;
  }
  .slide.active { opacity: 1; transform: scale(1); }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: rgba(0,0,0,0.25);
    display: block;
  }

  .glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 120%, rgba(255,182,193,0.22), transparent 60%);
  }

  .dots { display: flex; gap: 8px; margin: 14px 0 10px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255,255,255,0.3);
    cursor: pointer;
    transition: all 0.3s;
  }
  .dot.on { background: #FFD700; transform: scale(1.25); }

  .reel-caption {
    font-size: clamp(0.85rem, 3vw, 1.05rem);
    text-align: center;
    color: rgba(255,255,255,0.92);
    line-height: 1.6;
    padding: 0 12px;
  }
  .reel-caption b { color: #FFB6C1; }

  /* floating hearts */
  .heart {
    position: fixed;
    bottom: -40px;
    font-size: 1.3rem;
    animation: floatUp linear forwards;
    pointer-events: none;
    z-index: 5;
    opacity: 0.85;
  }
  @keyframes floatUp {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .sparkle {
    position: absolute;
    font-size: 1.1rem;
    animation: twinkle 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1.15); }
  }
</style>
</head>
<body>

<div class="reel-title">🎬 Happy Birthday Shristi! 🎉</div>

<div class="stage" id="stage">
  <div class="slide active"><img src="media/photo6.jpg" alt="Shristi 1"></div>
  <div class="slide"><img src="media/photo4.jpg" alt="Shristi 2"></div>
  <div class="slide"><img src="media/photo1.jpg" alt="Shristi 3"></div>
  <div class="slide"><img src="media/photo7.jpg" alt="Shristi 4"></div>
  <div class="slide"><img src="media/photo5.jpg" alt="Shristi 5"></div>
  <div class="slide"><img src="media/photo2.jpg" alt="Shristi 6"></div>
  <div class="slide"><img src="media/photo3.png" alt="Shristi 7"></div>
  <div class="glow"></div>
  <div class="sparkle" style="top:12px;left:16px">✨</div>
  <div class="sparkle" style="top:18px;right:18px;animation-delay:0.8s">🌟</div>
  <div class="sparkle" style="bottom:14px;left:22px;animation-delay:1.4s">💫</div>
  <div class="sparkle" style="bottom:20px;right:20px;animation-delay:0.4s">✨</div>
</div>

<div class="dots" id="dots"></div>

<div class="reel-caption">
  Thodi yaadein, thodi muskaan — <b>just for you!</b> 🥳💜<br>
  Keep shining, keep smiling — Happy Birthday! 🌸
</div>

<script>
  const slides  = [...document.querySelectorAll('.slide')];
  const dotsBox = document.getElementById('dots');
  let cur = 0;

  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    d.onclick = () => show(i);
    dotsBox.appendChild(d);
  });
  const dots = [...dotsBox.children];

  function show(i) {
    slides[cur].classList.remove('active');
    dots[cur].classList.remove('on');
    cur = i;
    slides[cur].classList.add('active');
    dots[cur].classList.add('on');
  }

  setInterval(() => show((cur + 1) % slides.length), 3200);

  // floating hearts
  const emojis = ['❤️','🎂','🎉','💜','🌸','✨','🥳'];
  setInterval(() => {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    h.style.left = Math.random() * 100 + '%';
    h.style.animationDuration = (5 + Math.random() * 4) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9500);
  }, 700);
</script>
</body>
</html>
